name: Test Go
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foods
          POSTGRES_PASSWORD: foods
          POSTGRES_DB: foods_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foods -d foods_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://foods:foods@localhost:5432/foods_test?sslmode=disable
      COVERAGE_THRESHOLD: "80"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v ./...
      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v c="$total" -v t="$COVERAGE_THRESHOLD" \
            'BEGIN { if (c+0 < t+0) { exit 1 } }' || {
              echo "::error::coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            }
